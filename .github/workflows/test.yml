name: Tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
